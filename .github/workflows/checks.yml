name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Node 24 checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: harborline-test-only
          POSTGRES_DB: harborline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d harborline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          run_install: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Report tool versions
        run: |
          node --version
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Generate Next.js types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Test public provider checker (offline)
        run: pnpm test:provider

      - name: Test server Gateway contracts (offline)
        run: pnpm test:gateway

      - name: Test PostgreSQL migrations and role isolation
        env:
          TEST_DATABASE_URL: postgresql://postgres:harborline-test-only@127.0.0.1:5432/harborline_test
          TEST_DATABASE_DISPOSABLE: "true"
        run: pnpm test:db

      - name: Build production application
        run: pnpm build
